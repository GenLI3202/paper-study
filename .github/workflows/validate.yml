name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned CI validation tools
        run: python -m pip install coverage==7.15.4 PyYAML==6.0.3

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run publication validator
        run: python scripts/validate.py

      - name: Measure test coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Enforce coverage threshold
        run: python -m coverage report

      - name: Validate frontmatter with PyYAML
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          import yaml

          skill_path = Path("skill/paper-study/SKILL.md")
          lines = skill_path.read_text(encoding="utf-8").splitlines()
          if not lines or lines[0] != "---":
              raise SystemExit("SKILL.md must start with YAML frontmatter")
          try:
              closing = lines.index("---", 1)
          except ValueError as exc:
              raise SystemExit("SKILL.md frontmatter is not closed") from exc
          metadata = yaml.safe_load("\n".join(lines[1:closing]) + "\n")
          if not isinstance(metadata, dict):
              raise SystemExit("SKILL.md frontmatter must be a mapping")
          if set(metadata) != {"name", "description", "compatibility"}:
              raise SystemExit(f"Unexpected frontmatter keys: {sorted(metadata)}")
          if metadata["name"] != "paper-study":
              raise SystemExit("Unexpected skill name")
          if not re.fullmatch(r"[a-z0-9-]+", metadata["name"]):
              raise SystemExit("Skill name is not portable")
          for key in ("description", "compatibility"):
              if not isinstance(metadata[key], str) or not metadata[key].strip():
                  raise SystemExit(f"{key} must be a nonempty string")
          if len(metadata["description"]) > 1024:
              raise SystemExit("description exceeds the official 1024-character limit")
          if len(metadata["compatibility"]) > 500:
              raise SystemExit("compatibility exceeds the official 500-character limit")
          print("PyYAML frontmatter validation passed")
          PY

      - name: Build and inspect exact release archive
        run: |
          python - <<'PY'
          import hashlib
          import stat
          import zipfile
          from pathlib import Path

          source = Path("skill/paper-study")
          expected_sources = {
              "SKILL.md",
              "references/note-template.md",
          }
          actual_sources = {
              path.relative_to(source).as_posix()
              for path in source.rglob("*")
              if path.is_file()
          }
          if actual_sources != expected_sources:
              raise SystemExit(f"Unexpected package sources: {sorted(actual_sources)}")

          output = Path("dist")
          output.mkdir(exist_ok=True)
          archive = output / "paper-study.skill"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as package:
              for relative in sorted(expected_sources):
                  archive_path = f"paper-study/{relative}"
                  info = zipfile.ZipInfo(archive_path, date_time=(2026, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  package.writestr(info, (source / relative).read_bytes())
          expected_archive = [
              "paper-study/SKILL.md",
              "paper-study/references/note-template.md",
          ]
          with zipfile.ZipFile(archive) as package:
              infos = package.infolist()
              names = sorted(info.filename for info in infos)
              bad_paths = [
                  name
                  for name in names
                  if Path(name).is_absolute() or ".." in Path(name).parts
              ]
              non_files = [
                  info.filename
                  for info in infos
                  if not stat.S_ISREG(info.external_attr >> 16)
              ]
          if names != expected_archive or bad_paths or non_files:
              raise SystemExit(f"Unexpected archive manifest: {names!r}")

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksum = output / "SHA256SUMS"
          checksum.write_text(f"{digest}  paper-study.skill\n", encoding="ascii")
          print("Archive manifest is exact:", names)
          print("SHA-256:", digest)
          PY

      - name: Upload verified release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: paper-study-${{ github.sha }}
          path: |
            dist/paper-study.skill
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
